<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#F6F9FD">
<title>Studie-app klas 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap">
<style>

/* Natuurkunde H3 + H5: zelfde huisstijl en motor als de wiskunde-apps */
:root{
  --bg:#F6F9FD; --card:#FFFFFF; --ink:#1D2842; --soft:#5B6784; --line:#D3DEEE; --grid:#E6EDF7;
  --ok:#1E8A4C; --bad:#D93A33; --okbg:#E7F5EC; --badbg:#FDECEB; --hl:#FFE14D; --tip:#FFF7D1; --pen:#2457C5;
  --c1:#FF8F8A; --c2:#FFE14D; --c3:#8FE0A3; --c4:#93CBFF; --c5:#FFB45E; --c6:#CDB0FF; --chipink:#1D2842;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --math:"STIX Two Text","Cambria Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B2B; --card:#1C2539; --ink:#EAF0FB; --soft:#A3B0CC; --line:#2E3A55; --grid:#253048;
  --ok:#5FD08C; --bad:#FF7A72; --okbg:#173326; --badbg:#3A1E22; --tip:#332D17; --pen:#8FB4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B2B; --card:#1C2539; --ink:#EAF0FB; --soft:#A3B0CC; --line:#2E3A55; --grid:#253048;
  --ok:#5FD08C; --bad:#FF7A72; --okbg:#173326; --badbg:#3A1E22; --tip:#332D17; --pen:#8FB4FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}
h2{font-size:1.35rem}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);color:inherit}
p{margin:0}
.sub{color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.sec:focus-visible,.link:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;font-size:.95rem}
.sec{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.sec:hover{border-color:var(--soft)}
.sq{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--chipink);font-size:.95rem}
.sec b{display:block;font-size:1.05rem}
.sec small{color:var(--soft)}
.sec .best{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;color:var(--soft);font-size:.9rem;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.q{font-size:1.15rem}
.q .m{font-size:1.3rem}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.15rem;min-height:56px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.55}
.fb{border-left:5px solid var(--ok);background:var(--card);border-radius:0 14px 14px 0;padding:14px 16px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.fb.bad{border-left-color:var(--bad)}
.fb .head{font-weight:700;font-size:1.1rem;margin-bottom:6px}
.fb.ok .head{color:var(--ok)} .fb.bad .head{color:var(--bad)}
.mistake{background:var(--badbg);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.again{background:var(--tip);border-radius:10px;padding:8px 12px;font-weight:700}
details.denk{background:var(--tip);border-radius:14px;padding:10px 14px}
details.denk summary{cursor:pointer;font-weight:700}
details.denk[open] summary{margin-bottom:6px}
ol.uitw{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.uitw li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px}
ol.uitw li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
ol.uitw li>div{min-width:0}
.res{font-size:1.2rem;margin-top:4px;overflow-x:auto;padding:4px 0}
.why{color:var(--soft);font-size:.95rem}
.step{border:1.5px dashed var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.step .opts{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.step .opt{font-size:1.05rem;min-height:46px;padding:10px 12px}
.done-step{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.spiek h3{font-family:var(--display);font-weight:800;margin:0 0 6px;font-size:1.1rem;display:flex;gap:10px;align-items:center}
.spiek .sq{width:30px;height:30px;font-size:.8rem;border-radius:8px}
.rule{padding:8px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule .res{font-size:1.15rem}
input[type=date]{font:inherit;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.count{font-family:var(--display);font-weight:800;font-size:1.4rem}
.score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.wl{display:flex;flex-direction:column;gap:8px}
.wl .card{padding:12px 14px}
.log{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.log b{margin-right:6px}
/* wiskunde-opmaak */
.m{font-family:var(--math);font-size:1.12em;white-space:nowrap}
.m sup{font-size:.68em;line-height:0;vertical-align:.62em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.12}
.fr>span{padding:0 .18em}
.fr>span:first-child{border-bottom:1.4px solid currentColor}
details.snap{border-top:1px solid var(--line);padding:10px 0}
details.snap:first-of-type{border-top:0}
details.snap summary{cursor:pointer;font-weight:700}
details.snap[open] summary{margin-bottom:8px}
details.snap>div{line-height:1.6}
.snapcard{background:var(--tip);border:0}
/* tabellen en grafieken zoals in het boek */
.tw{overflow-x:auto;max-width:100%;margin:8px 0}
.tb{border-collapse:collapse;font-family:var(--math);font-size:1.1rem;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:5px 14px;text-align:center;border-left:1.5px solid var(--c1)}
.tb th{border-left:none;font-weight:400;text-align:left;padding-left:4px;white-space:nowrap}
.tb tr:first-child th,.tb tr:first-child td{border-bottom:1.5px solid var(--c1)}
.plot{width:100%;height:auto;display:block;margin:6px 0}
.plot .g{stroke:var(--grid);stroke-width:1}
.plot .ax{stroke:var(--ink);stroke-width:1.5}
.plot .ln{stroke:var(--bad);stroke-width:2.5;fill:none}
.plot .pt{fill:var(--pen)}
.plot text{fill:var(--soft);font-family:var(--body);font-size:11px}
.plot .al{fill:var(--ink);font-family:var(--math);font-style:italic;font-size:14px}
.opt .tw,.opt .plot{margin:0}
.plot .ln2{stroke:var(--pen);stroke-width:2.5;fill:none}
.plot .ln3{stroke:var(--ink);stroke-width:2.5;fill:none}
.plot .as{stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 4}
.plot .fl{fill:var(--ink);font-family:var(--display);font-size:14px;font-weight:800}
.rt{white-space:nowrap}
.rad{border-top:1.4px solid currentColor;padding:0 .08em 0 .06em;margin-left:-.02em}
.m sub{font-size:.65em}
.tapwrap svg{width:100%;max-width:100%!important;cursor:crosshair;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.tapwrap.done svg{cursor:default}
.plot .ptbad line{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.tin td,.tin th{padding:5px 4px}
.tin td.gezet{color:var(--ok);font-weight:700}
input.cell{width:50px;font:inherit;font-family:var(--math);text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:5px 4px;background:var(--card);color:var(--ink)}
input.cell.ok{border-color:var(--ok);background:var(--okbg)}
input.cell.bad{border-color:var(--bad);background:var(--badbg)}
input.cell:focus-visible{outline:3px solid var(--c4);outline-offset:1px}
ul.ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* extra voor natuurkunde: kaartjes en thermometers */
.flip{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;font-size:1.2rem}
.flip b{font-family:var(--display);font-weight:800;font-size:1.5rem}
.flip .why{font-size:1rem}
.therm{display:block;margin:6px auto;height:auto}
.therm .tube{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.therm .col{fill:var(--bad)}
.therm .tk{stroke:var(--ink);stroke-width:1}
.therm text{fill:var(--ink);font-family:var(--body);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.95rem;color:var(--soft)}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.note{background:var(--tip);border-radius:14px;padding:12px 14px;font-size:.95rem}

/* ===== studie-app ===== */
/* Layout: één smalle kolom schriftpapier, zelfde familie als de oefenapps. Drie tabbladen: Vandaag (leerblokken), Cijfers (per vak), Week (plan tegenover gedaan). */
:root{
  --bg:#F6F9FD; --card:#FFFFFF; --ink:#1D2842; --soft:#5B6784; --line:#D3DEEE;
  --ok:#1E8A4C; --okbg:#E7F5EC; --warn:#B86400; --warnbg:#FFF1DE; --bad:#D93A33; --badbg:#FDECEB;
  --hl:#FFE14D; --tip:#FFF7D1; --chipink:#1D2842; --bar:#93CBFF; --flame:#FF8A1F; --flame2:#FFD23F;
  --c1:#FF8F8A; --c2:#FFE14D; --c3:#8FE0A3; --c4:#93CBFF; --c5:#FFB45E; --c6:#CDB0FF; --c7:#F7B3D6;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B2B; --card:#1C2539; --ink:#EAF0FB; --soft:#A3B0CC; --line:#2E3A55;
  --ok:#5FD08C; --okbg:#173326; --warn:#FFB45E; --warnbg:#3A2C17; --bad:#FF7A72; --badbg:#3A1E22; --tip:#332D17; --bar:#4F7FB8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B2B; --card:#1C2539; --ink:#EAF0FB; --soft:#A3B0CC; --line:#2E3A55;
  --ok:#5FD08C; --okbg:#173326; --warn:#FFB45E; --warnbg:#3A2C17; --bad:#FF7A72; --badbg:#3A1E22; --tip:#332D17; --bar:#4F7FB8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.25rem}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%)}
p{margin:0}
.sub{color:var(--soft)}
.tag{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{background:transparent;border:0;padding:8px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{padding:8px 4px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;font-size:.9rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.85rem;color:var(--soft)}
.vak{display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;gap:12px;align-items:center}
.sq{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--chipink);font-size:.9rem}
.sq.s{width:34px;height:34px;font-size:.75rem;border-radius:8px}
.vhead .nm{flex:1;min-width:0}
.vhead .nm b{display:block;font-size:1.1rem}
.gem{text-align:right;font-variant-numeric:tabular-nums}
.gem b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1}
.gem small{color:var(--soft);font-size:.8rem}
.need{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.need.ok{background:var(--okbg)} .need.warn{background:var(--warnbg)} .need.bad{background:var(--badbg)} .need.none{background:var(--tip)}
.need .big{font-weight:700}
.need.ok .big{color:var(--ok)} .need.warn .big{color:var(--warn)} .need.bad .big{color:var(--bad)}
.alt{font-size:.88rem;color:var(--soft);font-variant-numeric:tabular-nums}
details.tt summary{cursor:pointer;font-weight:700;font-size:.95rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:700;padding:6px 4px;border-bottom:1.5px solid var(--line)}
td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.p{color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{min-width:120px}
input.in{width:62px;font:inherit;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:5px 4px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
input.in.w{width:50px}
input.in.low{border-color:var(--bad);background:var(--badbg)}
input.in.q{border-style:dashed}
input.dt,select.sel,input.nm,input.tm{font:inherit;font-size:.9rem;border:1.5px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--card);color:var(--ink)}
input.nm{width:100%}
.x{background:none;border:0;color:var(--soft);font-size:1.1rem;padding:2px 6px}
.note{background:var(--tip);border-radius:14px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.state{color:var(--soft);font-size:.9rem}
/* vandaag */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav b{font-family:var(--display);font-size:1.3rem}
.prog{height:12px;border-radius:12px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.blk{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.blk.done{background:var(--okbg);border-color:var(--ok)}
.blk .ck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--soft);display:grid;place-items:center;font-weight:800;color:var(--ok)}
.blk.done .ck{border-color:var(--ok);background:var(--card)}
.blk .tx{flex:1;min-width:0}
.blk .tx small{display:block;color:var(--soft);font-size:.85rem}
.blk .mn{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.toets{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.toets:first-of-type{border-top:0}
.toets .tx{flex:1;min-width:0}
.cd{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* week */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px}
.wk .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wk .bars{position:relative;width:100%;max-width:34px;flex:1;display:flex;align-items:flex-end}
.wk .plan{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed var(--soft);border-radius:6px 6px 0 0}
.wk .done{position:relative;width:100%;background:var(--ok);border-radius:6px 6px 0 0}
.wk .lbl{font-size:.78rem;color:var(--soft)}
.wk .val{font-size:.75rem;font-variant-numeric:tabular-nums}
.vbar{display:grid;grid-template-columns:44px 1fr 92px;gap:10px;align-items:center;font-size:.92rem}
.vbar .tr{height:10px;background:var(--line);border-radius:10px;overflow:hidden;position:relative}
.vbar .tr i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:10px}
.vbar .nr{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--soft)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-right:5px}
.streak .sn{font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dot{text-align:center;font-size:.78rem;color:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:4px 0}
.dot.on{background:var(--flame);border-color:var(--flame);color:#1D2842;font-weight:700}
.dot.now{outline:2px solid var(--ink);outline-offset:1px}
.dot.vak{border-style:dashed;color:var(--soft);background:transparent}
.vkr{display:grid;grid-template-columns:1fr 1fr 32px;gap:6px;align-items:center;margin-top:6px}.vkr .nm{grid-column:1/3;width:100%;text-align:left}.vkr input[type=date]{width:100%;min-width:0}
div.blk{cursor:default}
button.ck{background:transparent;padding:0;cursor:pointer;width:32px!important;height:32px!important;font-size:1.05rem}
button.ck:disabled{cursor:default}

<script>
/* ---------- basis ---------- */
const $=s=>document.querySelector(s);
const stateEl=$('#state');
const COL=['--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const DAGEN=['zo','ma','di','wo','do','vr','za'],DAGL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAAND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DEF={v:3,doel:7,basis:20,blok:25,start:'16:00',totD:90,totNormaal:150,totZwaar:360,maxDagSchool:150,rekMin:30,maxDagWeekend:0,sprintMin:3,oefenMin:20,bijMin:20,record:0,streakStart:'2026-11-02',
  /* schoolvakanties regio Midden (Rotterdam) 2026-2027 en vaste vrije dagen; aan te passen bij Instellingen */
  vakanties:[{van:'2026-10-17',tot:'2026-10-25',naam:'Herfstvakantie'},{van:'2026-12-19',tot:'2027-01-03',naam:'Kerstvakantie'},
   {van:'2027-02-20',tot:'2027-02-28',naam:'Voorjaarsvakantie'},{van:'2027-03-29',tot:'2027-03-29',naam:'Tweede Paasdag'},
   {van:'2027-04-24',tot:'2027-05-02',naam:'Meivakantie'},{van:'2027-05-06',tot:'2027-05-07',naam:'Hemelvaart'},
   {van:'2027-05-17',tot:'2027-05-17',naam:'Tweede Pinksterdag'},{van:'2027-07-17',tot:'2027-08-29',naam:'Zomervakantie'}]};
let VAK=[],SET=Object.assign({},DEF),LOG={},db=null,canWrite=true,open=new Set(),tab='vandaag',dag=today();
try{tab=localStorage.getItem('tab')||'vandaag'}catch(e){}
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const f1=n=>n==null?'–':n.toFixed(1).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const d=new Date();return iso(d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function nice(s){const d=pd(s);return DAGL[d.getDay()]+' '+d.getDate()+' '+MAAND[d.getMonth()]}
function weekId(s){const d=pd(s);const t=new Date(d);t.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return t.getFullYear()+'-W'+String(1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)).padStart(2,'0')}
function monday(s){const d=pd(s);return addDays(s,-((d.getDay()+6)%7))}
const mins=n=>n>=60?`${Math.floor(n/60)} u ${n%60?String(n%60).padStart(2,'0')+' min':''}`.trim():n+' min';
const vakOf=id=>VAK.find(v=>v.id===id);

/* ---------- cijfers: rekenen ---------- */
function calc(v){
  let S=0,Wd=0,Wr=0,nr=0;
  (v.toetsen||[]).forEach(t=>{const w=num(t.weging)??1;if(w<=0)return;const c=num(t.cijfer);
    if(c!=null){S+=c*w;Wd+=w}else{Wr+=w;nr++}});
  const gem=Wd?S/Wd:null;
  const nodig=d=>Wr?(d*(Wd+Wr)-S)/Wr:null;
  return {gem,Wd,Wr,nr,nodig};
}
function status(c,d){
  if(!c.Wd&&!c.Wr)return {k:'none',t:'Nog geen toetsen'};
  if(!c.Wr)return c.gem>=d?{k:'ok',t:'Klaar: doel gehaald'}:{k:'bad',t:'Klaar: doel niet gehaald'};
  const n=c.nodig(d);
  if(c.Wd===0)return {k:'none',t:`Nog geen cijfers. Haal gemiddeld een ${f1(d)} op ${c.nr} ${c.nr===1?'toets':'toetsen'}.`,n};
  if(n<=1)return {k:'ok',t:'Je doel zit al bijna zeker goed',n};
  if(n<=d)return {k:'ok',t:`Nodig: gemiddeld ${f1(n)}`,n};
  if(n<=8.5)return {k:'warn',t:`Nodig: gemiddeld ${f1(n)}`,n};
  if(n<=10)return {k:'bad',t:`Nodig: gemiddeld ${f1(n)} (heel lastig)`,n};
  return {k:'bad',t:`Niet meer haalbaar (nodig: ${f1(n)})`,n};
}
/* een vak heeft "druk" als ze hoger moet scoren dan haar doel */
const druk=v=>{const c=calc(v);if(!c.Wd||!c.Wr)return false;return c.nodig(SET.doel)>SET.doel};

/* ---------- leerplan ---------- */
/* vakantie: geen school. Een vrije dag = vakantie waarna nog een vakantiedag komt: dan staat er niets op het plan en pauzeert de reeks.
   De laatste dag van een vakantie (meestal zondag) is een gewone dag: dan maakt ze huiswerk voor de eerste schooldag. */
const vakantieVan=s=>(SET.vakanties||[]).find(v=>v&&v.van&&v.tot&&s>=v.van&&s<=v.tot);
const vrijDag=s=>!!vakantieVan(s)&&!!vakantieVan(addDays(s,1));
const schooldag=s=>{const g=pd(s).getDay();return g>=1&&g<=5&&!vakantieVan(s)};
const vrijZa=s=>{const g=pd(s).getDay();return g===5||g===6};
/* vakken met een oefenapp in deze studie-app, en vakken die nog een losse app hebben */
const APPS=()=>Object.keys(VAKDATA);
const LOSSE={}; /* alle oefenapps zitten nu in de studie-app */
/* toetsweek = een week met 4 of meer toetsen: dan geen gewoon huiswerk */
function toetsDagen(){const m={};VAK.forEach(v=>(v.toetsen||[]).forEach(t=>{if(t.datum)m[t.datum]=(m[t.datum]||0)+1}));return m}
function inToetsweek(s){const m=toetsDagen(),w=weekId(s);return Object.entries(m).filter(([d])=>weekId(d)===w).reduce((a,[,n])=>a+n,0)>=4}
function volgendeSchooldag(s){let d=addDays(s,1);while(!schooldag(d))d=addDays(d,1);return d}
/* ---------- huiswerk uit SOMtoday (huiswerk.js) ---------- */
const HW=()=>window.HUISWERK||[];
const hwCompleet=d=>!!window.HUISWERK_COMPLEET_TOT&&d<=window.HUISWERK_COMPLEET_TOT;
const hwVoor=d=>HW().filter(h=>h.d===d);
function hwVak(n){const k=String(n||'').toLowerCase();return VAK.find(v=>v.id===k)||VAK.find(v=>String(v.naam||'').toLowerCase().includes(k))}
function hwLog(id){for(const w of Object.values(LOG))for(const e of (w.entries||[]))if(e.key==='hwt-'+id)return e;return null}
const hwDone=h=>!!(h.klaar||hwLog(h.id));
function hwRow(h,b,kort){const v=hwVak(h.vak),done=hwDone(h),naam=v?v.naam:h.vak.charAt(0).toUpperCase()+h.vak.slice(1);

/* ---------- tab: oefenen ---------- */
let OEF={},fromSprint=false;
/* ---------- nakijken door de ouder ----------
   Bij de paragraaftoets en proeftoets (talen, aardrijkskunde) kijkt ze open antwoorden zelf na. Wat ze zelf GOED rekent,
   komt in de collectie 'nakijk' (één document per antwoord). Alleen de dochter maakt documenten aan; alleen de ouder zet het oordeel
   (ok of fout, met een opmerking); alleen de dochter zet 'gezien'. Een 'fout' verwerkt het apparaat van de dochter zelf
   (Oefen.corrigeer: naar Mijn foute vragen, cijfer van die ronde één goed minder), zodat de ouder nooit in haar oefenstand schrijft. */
let NK={};const NK_DAGEN=3,NK_VERWERKT=new Set();
const nkLijst=()=>Object.entries(NK).map(([id,x])=>Object.assign({id},x)).sort((a,b)=>(b.t||0)-(a.t||0));
const nkOpen=()=>nkLijst().filter(x=>!x.oordeel);
const nkFoutNieuw=()=>nkLijst().filter(x=>x.oordeel==='fout'&&!x.gezien);
function nkPatch(id,p){NK[id]=Object.assign({},NK[id],p);const body=NK[id];write(()=>{const d=db.collection('nakijk').doc(id);return d.patch?d.patch(p):d.set(body)})}
function verwerkNakijk(){if(isOuder()||!GELADEN.nakijk||!GELADEN.oefen)return;
  Object.entries(NK).forEach(([id,x])=>{if(x.oordeel!=='fout'||!VAKDATA[x.vak]||Oefen.cur===x.vak||NK_VERWERKT.has(id))return;
    const st=Oefen.ctx.state(x.vak);st.nkDone=st.nkDone||[];NK_VERWERKT.add(id);if(st.nkDone.includes(id))return;
    Oefen.corrigeer(x.vak,x);st.nkDone=st.nkDone.concat([id]).slice(-300);Oefen.ctx.save(x.vak)})}
function openNakijk(){show('oefenen');Oefen.cur='nakijk';rNakijk()}
function rNakijk(){
  const ouder=isOuder(),open=nkOpen(),fout=nkFoutNieuw(),gedaan=nkLijst().filter(x=>x.oordeel).slice(0,10);
  const kaart=(x,stand)=>{const v=VAKDATA[x.vak];
    return `<div class="card stack antw ${x.oordeel==='fout'?'aw-bad':x.oordeel==='ok'?'aw-ok':''}" data-nk="${esc(x.id)}">
      <span class="tag">${esc(v?v.naam:x.vak)} · ${esc(x.toets||'')} · ${nice(x.d)}</span>
      <div class="sub">${esc(x.vraag)}</div>
      <div class="aw-r"><span class="aw-l">${ouder?'Zij schreef':'Jij schreef'}</span><div class="aw-jij">${esc(x.jij).replace(/\n/g,'<br>')}</div></div>

  ${ouder?`<h2>Na te kijken</h2>
    <div class="tip stack"><span>Bij de paragraaftoets en de proeftoets kijkt ze zinnen, vertalingen en aardrijkskunde zelf na. Hier staan de antwoorden die ze zelf <b>goed</b> rekende.</span>
      <span>Het antwoord in de app is een voorbeeld: in andere woorden kan ook goed zijn. Is het toch fout, tik dan op <b>Toch fout</b>. De vraag komt dan bij haar foute vragen, het cijfer van die toets gaat omlaag, en ze ziet jouw opmerking.</span></div>
    ${open.length?`<div class="stack">${open.map(x=>kaart(x,'open')).join('')}</div>`:'<div class="card">Er is niets om na te kijken.</div>'}
    ${gedaan.length?`<span class="tag">Al nagekeken</span><div class="stack">${gedaan.map(x=>kaart(x,'klaar')).join('')}</div>`:''}`
  :`<h2>Nagekeken door je ouder</h2>
    ${fout.length?`<div class="tip stack"><span>Deze antwoorden had je zelf goed gerekend, maar ze waren toch fout. Ze staan nu bij <b>Mijn foute vragen</b>, en het cijfer van die toets is aangepast.</span></div>

    if(o==='terug')nkPatch(id,{oordeel:null,opm:'',door:null,tO:null});
    else{const t=k.querySelector('.nk-opm');nkPatch(id,{oordeel:o,opm:t?t.value.trim().slice(0,500):'',door:window.WIE||null,tO:Date.now()})}

const saveT={};
function oefenCtx(){return {

/* oefentijd meten: alleen als je in een vak bezig bent en de laatste 2 minuten iets hebt gedaan */
let lastAct=Date.now(),ACT={},flushT=0;
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{
  if(isOuder()||!Oefen.cur||Oefen.cur==='sprint'||Oefen.cur==='nakijk'||tab!=='oefenen'||document.hidden||Date.now()-lastAct>120000)return;
  const d=today(),k=d+'|'+Oefen.cur;ACT[k]=(ACT[k]||0)+1;
  if(++flushT>=30){flushT=0;flushAct()}
},1000);
function flushAct(){Object.entries(ACT).forEach(([k,s])=>{if(!s)return;const [d,vid]=k.split('|'),wid=weekId(d);
  LOG[wid]=LOG[wid]||{entries:[]};const key='auto-'+vid;let e=LOG[wid].entries.find(x=>x.d===d&&x.key===key);
  if(!e){e={d,key,vak:vid,soort:'oefenen',sec:0,min:0};LOG[wid].entries=[...LOG[wid].entries,e]}
  e.sec=(e.sec||0)+s;e.min=Math.floor(e.sec/60);ACT[k]=0;saveLog(wid)})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAct()});

  const dr=i=>{const c=cs[i];if(!c.Wd)return -1e3;if(!c.Wr)return -500+(SET.doel-c.gem);return c.nodig(SET.doel)};
  const order=VAK.map((v,i)=>i).sort((a,b)=>dr(b)-dr(a)||(VAK[a].volgorde??0)-(VAK[b].volgorde??0));
  $('#v-cijfers').innerHTML=`
  <div class="card row" style="justify-content:space-between">

    <span>Een weging met een stippelrand komt niet uit het PTO en staat voorlopig op 1. Vraag de docent hoe vaak de toets meetelt. Vul ook de datum van elke toets in: dan plant de pagina het leren.</span>

    <div class="row" style="justify-content:space-between"><span><b>${mins(totG)}</b> <span class="sub">gedaan van ${mins(totP)} gepland</span></span><span class="sub">${totP?Math.round(totG/totP*100):0}%</span></div>
    <div class="wk" role="img" aria-label="Minuten per dag, gepland en gedaan">${days.map((d,i)=>`<div class="col"><span class="val">${G[i]||''}</span><div class="bars"><div class="plan" style="height:${P[i]/max*100}%"></div><div class="done" style="height:${G[i]/max*100}%"></div></div><span class="lbl" style="${d===today()?'font-weight:700;color:var(--ink)':''}">${DAGEN[pd(d).getDay()]}${startDag()&&d>=startDag()&&d<=today()?(gehaald(d)?' ✓':' ·'):''}</span></div>`).join('')}</div>
    <div class="legend"><span><i style="border:1.5px dashed var(--soft)"></i>gepland</span><span><i style="background:var(--ok)"></i>gedaan</span></div>
  </div>
  <div class="card stack"><span class="tag">Per vak deze week</span>
    ${vk.length?vk.map(([id,x])=>{const v=vakOf(id);return `<div class="vbar"><span>${v?`<span class="sq s" style="background:var(${COL[(v.volgorde??0)%COL.length]})">${esc(v.afk)}</span>`:lab(id)}</span><div class="tr"><i style="width:${x.p?Math.min(100,x.g/x.p*100):(x.g?100:0)}%"></i></div><span class="nr">${x.g} / ${x.p} min</span></div>`}).join(''):'<p class="sub">Nog niets gepland of gedaan deze week.</p>'}
  </div>
  <div class="row" style="justify-content:space-between"><span class="sub" style="font-size:.9rem">Ingelogd als ${esc(window.WIE||'')}</span><button class="link" id="logout">Uitloggen</button></div>
  <details class="card"><summary style="cursor:pointer;font-weight:700">Instellingen van het leerplan</summary>
    <div class="set" style="margin-top:12px">
      <label for="s-start">Vaste starttijd</label><input class="tm" type="time" id="s-start" data-s="start" value="${esc(SET.start)}" ${dis}>
      <label for="s-basis">Huiswerk per lesuur (min)</label><input class="in" id="s-basis" data-s="basis" inputmode="numeric" value="${SET.basis}" ${dis}>
      <label for="s-blok">Lengte van een blok (min)</label><input class="in" id="s-blok" data-s="blok" inputmode="numeric" value="${SET.blok}" ${dis}>
      <label for="s-td">Leertijd D-toets (overhoring in de les, min)</label><input class="in" id="s-td" data-s="totD" inputmode="numeric" value="${SET.totD??DEF.totD}" ${dis}>
      <label for="s-tn">Leertijd afsluitende toets (min)</label><input class="in" id="s-tn" data-s="totNormaal" inputmode="numeric" value="${SET.totNormaal}" ${dis}>
      <label for="s-tz">Leertijd zware afsluitende toets (min)</label><input class="in" id="s-tz" data-s="totZwaar" inputmode="numeric" value="${SET.totZwaar}" ${dis}>
      <label for="s-ms">Maximaal per schooldag, alles samen (min)</label><input class="in" id="s-ms" data-s="maxDagSchool" inputmode="numeric" value="${SET.maxDagSchool}" ${dis}>
      <label for="s-rk">Extra als toetsvoorbereiding anders niet past (min)</label><input class="in" id="s-rk" data-s="rekMin" inputmode="numeric" value="${SET.rekMin??DEF.rekMin}" ${dis}>
      <label for="s-mw">Leren op vrijdag en zaterdag (min)</label><input class="in" id="s-mw" data-s="maxDagWeekend" inputmode="numeric" value="${SET.maxDagWeekend}" ${dis}>
      <label for="s-bm">Bijhouden na huiswerk, per vak (min)</label><input class="in" id="s-bm" data-s="bijMin" inputmode="numeric" value="${SET.bijMin}" ${dis}>
      <label for="s-om">Dagelijks oefenen in de app (min)</label><input class="in" id="s-om" data-s="oefenMin" inputmode="numeric" value="${SET.oefenMin}" ${dis}>
      <label for="s-sm">Lengte van een sprint (min)</label><input class="in" id="s-sm" data-s="sprintMin" inputmode="numeric" value="${SET.sprintMin}" ${dis}>
    </div>
    <div style="margin-top:16px"><b>Vakanties en vrije dagen</b>
      <p class="sub" style="font-size:.9rem;margin:4px 0 0">Ingevuld voor regio Midden (Rotterdam), schooljaar 2026-2027. Een studiedag of afwijkende vakantie van school kun je zelf toevoegen. In de vakantie staat er niets op het plan en staat de reeks op pauze. De laatste vakantiedag is een gewone dag, voor het huiswerk van de eerste schooldag.</p>
      ${(SET.vakanties||[]).map((v,i)=>`<div class="vkr"><input class="in nm" data-vk="${i}" data-vf="naam" value="${esc(v.naam||'')}" placeholder="Naam" aria-label="Naam" ${dis}><span></span>
        <input class="in" type="date" data-vk="${i}" data-vf="van" value="${esc(v.van||'')}" aria-label="Van" ${dis}><input class="in" type="date" data-vk="${i}" data-vf="tot" value="${esc(v.tot||'')}" aria-label="Tot en met" ${dis}>
        <button class="x" data-vkdel="${i}" aria-label="Verwijder ${esc(v.naam||'')}" ${dis}>×</button></div>`).join('')}
      <button class="btn ghost sm" id="vk-add" style="margin-top:8px" ${dis}>Vakantie of vrije dag toevoegen</button></div>
    <p class="sub" style="font-size:.9rem;margin-top:10px">Een D-toets (een toets waarvan de naam begint met 'D-toets' of 'Dtoets') is een overhoring in de les en heeft een eigen leertijd; moet ze bij dat vak omhoog, dan komt er de helft bij. Een afsluitende toets is zwaar als hij 3 keer of vaker meetelt, of als ze bij dat vak hoger moet scoren dan haar doel. Oefentijd telt alleen als zij zelf in de app werkt, niet als een ouder ingelogd is. Het maximum per schooldag geldt voor alles samen: huiswerk, bijhouden en toetsvoorbereiding. Zondag tot en met donderdag begint het plan met opwarmen: 3 minuten rekensprint en 5 sommen rekenregels van vandaag. Voor het huiswerk van een vak in de app met een komende toets staan eerst 3 opwarmvragen uit eerdere paragrafen (ongeveer 2 minuten); is het huiswerk al af, dan vervalt dat. Na huiswerk voor een vak dat in de app zit en in deze periode een toets heeft, komt bijhouden: dezelfde paragraaf in de app, zolang het binnen het maximum per dag past; is het huiswerk alleen al te veel, dan vervalt het bijhouden die dag. Heeft een vak in deze periode (tot en met de eerstvolgende toetsweek) geen toets met een datum, dan staat er voor dat vak alleen het huiswerk; ook dagelijks oefenen in de app komt alleen bij vakken met een komende toets. De toetsvoorbereiding wordt verdeeld over de dagen vóór de toets, met de eerste toets eerst; komt een dag aan het maximum, dan schuift het naar eerder, maar nooit naar een dag die voorbij is of al af is. Wat niet meer past, staat als melding bovenaan Vandaag. Is een dag af, dan blijft hij af: wat er daarna bijkomt, telt die dag niet meer mee. Bij vakken in de app wordt de toetsvoorbereiding korter naarmate ze meer paragrafen met een 7 of hoger heeft afgesloten: alle paragrafen gehaald is de helft, met een voldoende proeftoets erbij 30%. Huiswerk staat in de app als het uit SOMtoday is overgenomen, anders lesuren × minuten per lesuur. Vrijdag en zaterdag: alleen een sprint, tenzij je hierboven leertijd voor vrijdag en zaterdag invult. Dan staat er zoveel minuten toetsvoorbereiding of oefenen in de app.</p>
  </details>`;
  $('#logout').onclick=async()=>{flushAct();if(SB)await SB.auth.signOut();location.reload()};
  $('#wprev').onclick=()=>{dag=addDays(dag,-7);render()};$('#wnext').onclick=()=>{dag=addDays(dag,7);render()};
  document.querySelectorAll('[data-s]').forEach(el=>el.onchange=()=>{const k=el.dataset.s;
    if(k==='start'){SET.start=el.value||DEF.start}else{const n=num(el.value);if(n==null||n<0||n>600){el.value=SET[k];return}SET[k]=Math.round(n)}
    saveSet([k]);render()});
  const vks=()=>SET.vakanties=(SET.vakanties||[]).map(v=>Object.assign({},v));
  document.querySelectorAll('[data-vk]').forEach(el=>el.onchange=()=>{const L=vks(),v=L[+el.dataset.vk];if(!v)return;v[el.dataset.vf]=el.value.trim();
    if(v.van&&v.tot&&v.tot<v.van)v.tot=v.van;SCHED=null;saveSet(['vakanties']);render()});
  document.querySelectorAll('[data-vkdel]').forEach(b=>b.onclick=()=>{const L=vks();L.splice(+b.dataset.vkdel,1);SCHED=null;saveSet(['vakanties']);render()});
  const va=$('#vk-add');if(va)va.onclick=()=>{const L=vks();L.push({van:today(),tot:today(),naam:'Vrije dag'});SCHED=null;saveSet(['vakanties']);render()};
}

/* ---------- invoer cijfers ---------- */
$('#v-cijfers').addEventListener('change',e=>{
  const el=e.target;if(!el.dataset.f||!el.dataset.v)return;
  const v=vakOf(el.dataset.v);if(!v)return;
  if(el.dataset.f==='lesuren'){const n=num(el.value);v.lesuren=n==null?null:Math.max(0,Math.round(n));saveVak(v);render();return}
  const t=v.toetsen.find(x=>x.id===el.dataset.t);if(!t)return;
  const f=el.dataset.f;let val=f==='stofOnbekend'?!!el.checked:el.value.trim();
  if(f==='stofOnbekend'){SCHED=null;if(!val)delete t.stofOnbekend;else t.stofOnbekend=true;saveVak(v);render();return}
  if(f==='weging'||f==='cijfer'){const n=num(val);
    if(val!==''&&(n==null||n<0||(f==='cijfer'&&(n<1||n>10)))){el.value=t[f]??'';stateEl.textContent='Vul een cijfer tussen 1 en 10 in.';return}
    val=val===''?(f==='weging'?1:null):Math.round(n*10)/10;
    if(f==='weging')t.wegingOnzeker=false;}
  if(f==='datum')val=val||null;
  if(t[f]===val)return;
  t[f]=val;stateEl.textContent='';saveVak(v);render();
});
$('#v-cijfers').addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'),d=e.target.closest('[data-del]');
  if(a){const v=vakOf(a.dataset.add);v.toetsen.push({id:'e'+Date.now().toString(36),periode:2,naam:'Overhoring',weging:1,cijfer:null,datum:null,eigen:true});open.add(v.id);saveVak(v);render();}
  if(d){const [vid,tid]=d.dataset.del.split('|');const v=vakOf(vid);v.toetsen=v.toetsen.filter(t=>t.id!==tid);saveVak(v);render();}
});

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{flushAct();if(b.dataset.tab==='oefenen'&&tab==='oefenen'&&Oefen.cur){Oefen.stop()}tab=b.dataset.tab;try{localStorage.setItem('tab',tab)}catch(e){};render()});
const GELADEN={};
function render(){
  SCHED=null;SCHED_OUD=null;
  if(GELADEN.vakken&&GELADEN.log&&GELADEN.oefen)stempelBij();
  verwerkNakijk();
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));
  ['vandaag','oefenen','cijfers','week'].forEach(t=>$('#v-'+t).hidden=t!==tab);
  const foc=document.activeElement&&document.activeElement.id;
  if(tab==='vandaag')rVandaag();else if(tab==='oefenen')rOefenen();else if(tab==='cijfers')rCijfers();else rWeek();
  if(foc){const el=document.getElementById(foc);if(el&&el!==document.activeElement)el.focus()}
}

Oefen.ctx=oefenCtx();

/* ---------- opslag in Supabase (tabel "docs": coll, id, data) ----------
   Zelfde vorm als de opslag die de pagina gebruikt: collection(c).onSnapshot / doc(id).set */
let SB=null;
function loginForm(msg){return new Promise(res=>{
  document.querySelector('.tabs').hidden=true;document.getElementById('app').classList.add('login');
  stateEl.innerHTML=`<form id="lf" class="card stack" style="max-width:420px">
    <b>Inloggen</b><span class="sub" style="font-size:.9rem">${msg||'Log in met het account dat je van je ouder hebt gekregen.'}</span>
    <label>E-mail<br><input class="nm" id="lf-e" type="email" autocomplete="username" required></label>
    <label>Wachtwoord<br><input class="nm" id="lf-p" type="password" autocomplete="current-password" required></label>
    <button class="btn">Inloggen</button><button type="button" class="link" id="lf-new">Nog geen account? Maak er een aan</button><span id="lf-m" style="color:var(--bad)"></span></form>`;
  document.getElementById('lf-new').onclick=async()=>{const em=document.getElementById('lf-e').value.trim(),pw=document.getElementById('lf-p').value,m=document.getElementById('lf-m');
    if(!em||pw.length<6){m.textContent='Vul je e-mail in en een wachtwoord van minstens 6 tekens, en tik dan nog een keer.';return}
    const {data,error}=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){m.textContent='Account maken lukte niet: '+error.message;return}
    if(data.session){stateEl.textContent='';document.querySelector('.tabs').hidden=false;document.getElementById('app').classList.remove('login');res(data.session);return}
    m.style.color='var(--ok)';m.textContent='Gelukt. Open de mail van Supabase en tik op de link. Kom daarna terug en log in.'};
  document.getElementById('lf').onsubmit=async e=>{e.preventDefault();
    const {data,error}=await SB.auth.signInWithPassword({email:document.getElementById('lf-e').value.trim(),password:document.getElementById('lf-p').value});
    if(error){document.getElementById('lf-m').textContent='Dat klopt niet. Controleer je e-mail en wachtwoord.';return}
    stateEl.textContent='';document.querySelector('.tabs').hidden=false;document.getElementById('app').classList.remove('login');res(data.session)};
})}
async function startDb(){
  if(window.DEMO)return window.DEMO.db(); /* proefversie: voorbeeldgegevens, geen Supabase */
  if(!window.supabase||!window.CONFIG||!CONFIG.url||CONFIG.url.includes('JOUW')){stateEl.textContent='De app is nog niet gekoppeld. Vul config.js in (zie de stappen).';return null}
  SB=supabase.createClient(CONFIG.url,CONFIG.key);
  let {data:{session}}=await SB.auth.getSession();
  if(!session)session=await loginForm();
  window.WIE=session.user.email;
  const cache={},L={};
  const snapC=(c,p)=>({docs:Object.entries(cache[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false,hasPendingWrites:!!p}});
  const notify=(c,p)=>(L[c]||[]).forEach(f=>f(p));
  async function load(c){const {data,error}=await SB.from('docs').select('id,data').eq('coll',c);
    if(error)throw {code:'unavailable',message:error.message};
    cache[c]=Object.fromEntries(data.map(r=>[r.id,r.data]));notify(c,false)}
  const refresh=()=>Object.keys(L).forEach(c=>load(c).catch(()=>{}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  setInterval(()=>{if(!document.hidden&&!(Oefen.cur))refresh()},60000);
  return {collection:c=>({
    onSnapshot(f,err){(L[c]=L[c]||[]).push(p=>f(snapC(c,p)));load(c).catch(e=>err&&err(e));return()=>{}},
    doc:id=>({
      async set(b){cache[c]=cache[c]||{};cache[c][id]=JSON.parse(JSON.stringify(b));notify(c,true);
        const {error}=await SB.from('docs').upsert({coll:c,id,data:b,updated_at:new Date().toISOString()});
        if(error)throw {code:'unavailable',message:error.message}},
      async patch(p){const {data,error}=await SB.from('docs').select('data').eq('coll',c).eq('id',id).maybeSingle();
        if(error)throw {code:'unavailable',message:error.message};
        const b=Object.assign({},(data&&data.data)||{},JSON.parse(JSON.stringify(p)));cache[c]=cache[c]||{};cache[c][id]=b;notify(c,true);
        const r=await SB.from('docs').upsert({coll:c,id,data:b,updated_at:new Date().toISOString()});
        if(r.error)throw {code:'unavailable',message:r.error.message}},
      onSnapshot(f,err){(L[c]=L[c]||[]).push(()=>f({exists:!!(cache[c]||{})[id],data:()=>(cache[c]||{})[id]}));load(c).catch(e=>err&&err(e));return()=>{}}
    })})};
}

(async()=>{
  render();
  const timer=setTimeout(()=>{if(!VAK.length&&!document.getElementById('lf'))stateEl.textContent='De gegevens zijn nog niet bereikbaar. Laad de pagina later opnieuw.'},10000);
  db=await startDb();
  if(!db){clearTimeout(timer);return}
  const busy=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='SELECT')};
  db.collection('vakken').onSnapshot(snap=>{
    if(!snap.metadata.fromCache)clearTimeout(timer);
    VAK=snap.docs.map(d=>Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()))));GELADEN.vakken=1;
    stateEl.textContent=VAK.length?'':'Er staan nog geen vakken in.';
    if(busy()&&snap.metadata.hasPendingWrites)return;
    render();
  },()=>{clearTimeout(timer);stateEl.textContent='De cijfers konden niet geladen worden.'});
  db.collection('instellingen').doc('plan').onSnapshot(s=>{const x=s.exists?s.data():{};SET=Object.assign({},DEF,x);GELADEN.set=1;SCHED=null;if((x.v||1)<2){SET.maxDagWeekend=0;SET.v=2}if((SET.v||1)<3){SET.maxDagSchool=150;SET.bijMin=20;SET.v=3}if(!busy())render()},()=>{});
  db.collection('oefen').onSnapshot(snap=>{GELADEN.oefen=1;snap.docs.forEach(d=>{if(Oefen.cur!==d.id)OEF[d.id]=JSON.parse(JSON.stringify(d.data()))});if(!busy())render()},()=>{});
  db.collection('nakijk').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=JSON.parse(JSON.stringify(d.data())));NK=o;GELADEN.nakijk=1;
    const a=document.activeElement;if(Oefen.cur==='nakijk'){if(!(a&&a.classList&&a.classList.contains('nk-opm')))rNakijk()}else if(!busy())render()},()=>{});
  db.collection('log').onSnapshot(snap=>{const L={};snap.docs.forEach(d=>L[d.id]=JSON.parse(JSON.stringify(d.data())));LOG=L;GELADEN.log=1;if(!busy())render()},()=>{});
})();
</script>
